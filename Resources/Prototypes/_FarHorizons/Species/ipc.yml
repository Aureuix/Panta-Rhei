- type: species
  id: IPC
  name: species-name-ipc
  roundStart: true
  prototype: MobIPC
  sprites: MobIPCSprites
  markingLimits: MobIPCMarkingLimits
  dollPrototype: MobIPCDummy
  skinColoration: Hues
  minAge: 1
  maxAge: 240
  oldAge: 50
  youngAge: 50
  maleFirstNames: IpcFirst
  femaleFirstNames: IpcFirst
  lastNames: IpcLast
  naming: FirstDashLast
  sexes:
  - Unsexed

- type: speciesBaseSprites
  id: MobIPCSprites
  sprites:
    Head: MobHumanoidAnyMarking # Euph - was MobIPCHead
    Snout: MobHumanoidAnyMarking # Euph - was MobHumanoidAnyMarking
    Chest: MobHumanoidAnyMarking # Euph - was MobIPCTorso
    HeadTop: MobHumanoidAnyMarking # Euph - was MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking # Euph - was MobHumanoidAnyMarking
    Eyes: MobHumanoidAnyMarking # Euph - was MobIPCEyes
    LArm: MobHumanoidAnyMarking # Euph - was MobIPCLArm
    RArm: MobHumanoidAnyMarking # Euph - was MobIPCRArm
    LHand: MobHumanoidAnyMarking # Euph - was MobIPCLHand
    RHand: MobHumanoidAnyMarking # Euph - was MobIPCRHand
    LLeg: MobHumanoidAnyMarking # Euph - was MobIPCLLeg
    RLeg: MobHumanoidAnyMarking # Euph - was MobIPCRLeg
    LFoot: MobHumanoidAnyMarking # Euph - was MobIPCLFoot
    RFoot: MobHumanoidAnyMarking # Euph - was MobIPCRFoot

- type: markingPoints
  id: MobIPCMarkingLimits
  points:
    HeadTop:
      points: 1
      required: true
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Head:
      points: 2
      required: true
    HeadSide:
      points: 2
      required: true
    Chest:
      points: 3
      required: false
    Legs:
      points: 3
      required: false
    Arms:
      points: 3
      required: false

